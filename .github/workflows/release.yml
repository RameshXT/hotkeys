name: Build & Release xtkeys

on:
  push:
    tags:
      - 'v*'          # triggers on any version tag e.g. v1.0.0, v1.2.3
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build Script
        shell: powershell
        run: .\build.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest' }}
          body: |
            ## Install

            Run this in any PowerShell window on any Windows machine:

            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/xtkeys.ps1 | iex
            ```

            ## What's included
            | File | Description |
            |---|---|
            | `hotkeys.ahk` | The AutoHotkey script |
            | `hotkeys.sha256` | SHA-256 checksum for verification |
            | `xtkeys.ps1` | Installer & CLI |
            | `hotkeys.zip` | Full bundle (ahk + installer) |
          files: |
            dist/hotkeys.ahk
            dist/hotkeys.sha256
            dist/xtkeys.ps1
            dist/hotkeys.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
